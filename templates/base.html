<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Audio Collector — ConsultBae{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115; --card: #171a21; --border: #262b36;
      --text: #e7e9ee; --muted: #9aa3b2; --accent: #6ea8fe;
      --danger: #ff6b6b; --ok: #59d18b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    header a { color: var(--text); text-decoration: none; font-weight: 600; }
    nav a { color: var(--muted); text-decoration: none; margin-left: 18px; font-size: 14px; }
    nav a:hover { color: var(--accent); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 24px; margin-bottom: 20px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input[type=text], input[type=tel] {
      width: 100%; padding: 10px 12px; background: #10131a; border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
    }
    button, .btn {
      background: var(--accent); color: #0b0e14; border: none; padding: 10px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .flash {
      background: #24344a; border: 1px solid #3a5578; color: #cfe0ff;
      padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    audio { height: 32px; width: 200px; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .badge.good { background: #16321f; color: var(--ok); }
    .badge.fair { background: #3a3417; color: #e8d16b; }
    .badge.poor { background: #3a1717; color: var(--danger); }
    .badge.unknown { background: #262b36; color: var(--muted); }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); display: inline-block; }
    .rec-dot.recording { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .muted { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}">🎙️ Audio Collector</a>
    <nav>
      <a href="{{ url_for('index') }}">Submit</a>
      <a href="{{ url_for('submissions') }}">All submissions</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
